name: Bootstrap checks
on: [push, pull_request]
jobs:
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check apps packages scripts tests
      - run: uv run ruff format --check apps packages scripts tests
      - run: uv run pytest -q
      - run: uv run pnpm generate
      - run: git diff --exit-code -- packages/sdk-ts
      - run: uv run pnpm check
      - run: pnpm build
      - run: uv run python scripts/dev.py start
      - run: uv run python tests/process_smoke.py
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:desktop
      - if: runner.os == 'Windows'
        run: pnpm test:desktop
      - if: always()
        run: uv run python scripts/dev.py stop
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: autumn-test
          POSTGRES_DB: autumn_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTUMN_TEST_POSTGRES: postgresql+psycopg://postgres:autumn-test@localhost:5432/autumn_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run pytest -q tests/test_bootstrap.py
