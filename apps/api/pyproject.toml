[project]
name = "autumn-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["autumn-control", "fastapi>=0.120,<1", "uvicorn>=0.38,<1"]

[project.optional-dependencies]
local = []
enterprise = ["autumn-control[enterprise]"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
